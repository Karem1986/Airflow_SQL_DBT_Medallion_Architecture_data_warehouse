# Why Docker compose and simply not a local postgres database running locally?

version: '3.8' # Docker will know which servant to use for the task!

services: # Docker know what you want him to do, add as many services as you need.
  postgres:
    image: postgres:15-alpine # Lightweight image to save disk space!
    container_name: prepal_postgres # 4. Container Identifier
    environment: #Mandatory parameter
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: # 6. From where are we spinning up this local database?
      - "${DB_PORT}:5432"
    volumes: # Where the data will be stored? Hint: Local Storage Mount
      - postgres_data:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4
    container_name: prepal_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - postgres

  airflow:
    image: apache/airflow:3.3.0
    container_name: prepal_airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false" # Hide Airflow's example DAGs, show only ours
      # Airflow reads AIRFLOW_CONN_<CONN_ID> env vars as ready-made connections,
      # so 'prepal_postgres_conn' (used in the DAG) exists with no manual UI setup.
      AIRFLOW_CONN_PREPAL_POSTGRES_CONN: postgres://${DB_USER}:${DB_PASSWORD}@prepal_postgres:5432/${DB_NAME}
      # dbt reads these same variables from profiles.yml via env_var()
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_HOST: prepal_postgres # Inside the Docker network, Postgres is not "localhost"
      # Installs dbt at container startup. Fine for this demo; a real
      # deployment would bake this into a custom image instead.
      _PIP_ADDITIONAL_REQUIREMENTS: dbt-postgres
    ports:
      - "8085:8080" # 8080 is already taken by pgAdmin above
    volumes:
      - ../airflow:/opt/airflow/dags # This repo's DAG file
      - ../dbt:/opt/airflow/dbt      # Mounted so the DAG's dbt build task can reach it
    depends_on:
      - postgres
